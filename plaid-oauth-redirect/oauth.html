<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ea">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Spendy</title>
  <style>
    :root { --bg: #f7f3ea; --text: #211d15; --muted: #6f6858; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    body { display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
    h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 17px; color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>You're all set</h1>
    <p>Head back to Spendy to finish</p>
  </main>
</body>
</html>
